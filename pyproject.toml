# Ours. Upstream's original is docs/reference/upstream-pyproject.toml.
# Drives VS Code, the CLI, and the apply.py format stage — one source of truth.
# Formatter versions are pinned in tools/reforge/requirements.lock; bumping them
# reformats the generated layout, so bump deliberately, in one commit on base.

[tool.black]
line-length = 120
skip-string-normalization = true
# force-exclude (not extend-exclude) so editor format-on-save can't reach dev/
force-exclude = '^/(dev|docs)/'

[tool.isort]
profile = "black"
line_length = 120
force_single_line = true
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
ensure_newline_before_comments = true
order_by_type = true
filter_files = true
# import ORDER is semantic in these: Core/__init__.py facade star-imports shadow
# by position; GlobalCache startup order is load-bearing; follow/__init__ exports
# nothing on purpose; Py4GW_widget_manager.py is the pinned DLL entry point
extend_skip_glob = [
    "dev/*",
    "docs/*",
    "Core/__init__.py",
    "Core/GlobalCache/*",
    "GlobalCache/*",
    "HeroAI/follow/*",
    "Py4GW_widget_manager.py",
]

[tool.pytest.ini_options]
# test/ singular, not tests/ — upstream ships a top-level tests/ that the manifest
# moves to dev/tests/imgui/. Singular collides with nothing upstream ships.
testpaths = ["test"]
# leaf is deselected by default: widget and script module bodies do real work at
# import (one of them blocks indefinitely), so they are opt-in via `-m leaf`.
# --import-mode has no ini key of its own; it only takes effect from here.
# test/ mirrors the source tree, so basenames repeat (test_frame.py under both
# Core/FrameTree and HeroAI/fight). prepend mode derives the module name from the
# basename alone and errors on the second one; importlib derives it from the full
# path. It also stops each test's folder being spliced into sys.path, where a
# test/Core/ would sit ahead of the real Core/.
addopts = "-q -m 'not leaf' --import-mode=importlib"
# test/ is absent on purpose: it would shadow the stdlib `test` package.
# test/conftest.py adds itself for nativestub, and breakage.py gets it from sys.path[0].
pythonpath = ["."]
markers = ["leaf: tier-4 widgets and scripts; run explicitly with -m leaf"]
