dest = "keep"
tier = "core"
note = "core-tier, pinned. 34 Core/ files import ~10 of its modules (targeting 19 refs, custom_skill_src.skill_types 14, types 10, cache_data 6) incl. BottingTree, BuildMgr, SkillManager and 20 Builds files. Folding it into Core/heroai needs an import-only codemod: a blunt token rename would also rewrite the \"HeroAI\" config-path and MODULE_NAME strings under Runtime/settings/Defaults/HeroAI/."

[[rule]]
