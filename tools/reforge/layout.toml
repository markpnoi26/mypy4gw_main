dest = "Scripts/py4gw-examples/{rel:Examples}"
tier = "script"
pack = "examples"


# ============================================================================
# RUNTIME — settings, accounts, db seeds, reference data.
# Named Runtime/ and not Data/ because Windows is case-insensitive: a Data/
# destination collides with the existing data/ source, and the data/** rule
# then re-matches its own output forever.
# ============================================================================

[[rule]]
match = "Settings/**"
dest = "keep"
note = "PINNED. The native side owns template seeding from settings/Defaults/*.cfg (see Core/py4gwcorelib_src/Settings.py:240; the DLL carries the literal 'default_template'). The persistence jail roots at <projects_path>/settings and <projects_path>/json, confirmed empirically: MyPy4GW created settings/ at the project root when it ran. Moving these breaks seeding."

[[rule]]
match = "json/**"
dest = "Runtime/accounts/{rel:json}"

[[rule]]
match = "data/**"
dest = "Runtime/db/{rel:data}"

[[rule]]
match = "EnemyData/**"
dest = "Runtime/enemy/{rel:EnemyData}"


