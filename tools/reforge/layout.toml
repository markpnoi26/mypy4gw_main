[meta]
base = "vendor"
target_branch = "layout"
strict = false


# ============================================================================
# TOOLCHAIN + OWN DOCS — tracked in this repo, must survive the transform.
# ============================================================================

[[rule]]
match = "tools/**"
dest = "keep"
tier = "dev"
note = "the transform itself; promoted out of .claude so it ships with the repo"

[[rule]]
match = "qa/**"
dest = "keep"
tier = "dev"
note = "our gates. Named qa/ because upstream owns tests/, which moves to dev/tests/imgui/."

[[rule]]
match = "rules/**"
dest = "keep"
tier = "docs"
note = "RS-000. Our standing decisions, and the generated ledgers that track them. Outranks docs/, which is upstream's reference material plus our own historical handovers. See rules/README.md."

# RS-006 retired the override that used to sit here. The tier map was never an
# upstream file — it only ever existed untracked in the fork — so a rule matching
# `docs/tier_map_and_separation_plan.md` matched nothing. It now lives at
# rules/TIER_MAP.md, covered by the `rules/**` keep above.


# ============================================================================
# CODEMODS — derived rewrites applied after moves.
# ============================================================================

[[codemod]]
kind = "module_rename"
old = "Py4GWCoreLib"
new = "Core"
scope = "**/*.py"
exclude = ["tools/"]
note = "RS-001. 3678 import statements across 1009 files. Also rewrites the dynamic import at BuildMgr.py:2037 and any 'Py4GWCoreLib/...' string path. verify.py greps for survivors. tools/ is excluded because the transform describes this rename in its own prose and would rewrite itself into nonsense."

[[codemod]]
kind = "import_rename"
old = "Widgets.Coding.Examples.Skills.SkillInfo"
new = "Widgets.lib.SkillInfo"
scope = "**/*.py"
exclude = ["tools/"]
note = "Pairs with the SkillInfo override. Full module path is correct here, not the package prefix: EZ Cast.py:19 imports the module itself, and Widgets/Coding/Examples/Skills/ held other files that went elsewhere."

[[codemod]]
kind = "import_rename"
old = "Widgets.System.Messaging"
new = "Widgets.Panels.Messaging"
scope = "**/*.py"
exclude = ["tools/"]
note = "Widget-to-widget imports still named the pre-move category. The widget files moved but nothing rewrote their importers, so discovery fails at load with ModuleNotFoundError: No module named 'Widgets.System'."

[[codemod]]
kind = "import_rename"
old = "Widgets.Automation.Helpers"
new = "Widgets.Upkeep"
scope = "**/*.py"
exclude = ["tools/"]
note = "Same class as the Messaging rename; Messaging.py:27-28 imports Pycons, so this one takes Messaging down with it. Must be the package prefix, not ...Helpers.Pycons: rename_imports matches a prefix of the dotted path, and `from Widgets.Automation.Helpers import Pycons` names only the package. NOT 1:1 — Helpers also held Dialogs/, EZ Cast and Elite Skills, which went to Dialogs/, Combat/ and py4gw-tasks. Safe today because Pycons is the only module anyone imports from it; add a `keep` if that changes."

[[codemod]]
kind = "import_rename"
old = "Widgets.Automation.Multiboxing"
new = "Widgets.Multibox"
scope = "**/*.py"
exclude = ["tools/"]
note = "Same class. Dhuum Helper.py:237 imports the HeroAI widget by its old path. 1:1 — Multiboxing held only HeroAI.py and CombatPrep.py, and CombatPrep is dropped."

[[codemod]]
kind = "import_rename"
old = "Sources"
new = "dev.reference"
scope = "**/*.py"
exclude = ["tools/", "qa/"]
keep = ["Sources.marks_sources", "Sources.ApoSource.InvPlus"]
note = "RS-002. Completes the Sources demotion: the files moved to dev/reference/ but 21 leaf importers still said `Sources.`. import_rename, not module_rename, for two reasons — the carve-outs stay at the root path and are imported from files that do get rewritten, so the exemption is per-import rather than per-file; and TeamInventoryViewer.py:35 joins the literal directory 'Sources/marks_sources/mods_data', which dots would break."


# ============================================================================
# CORE — the library. Renamed Py4GWCoreLib -> Core.
# ============================================================================

[[rule]]
match = "Py4GWCoreLib/**"
dest = "Core/{rel:Py4GWCoreLib}"
tier = "core"

[[override]]
match = "Py4GWCoreLib/tests/**"
dest = "dev/tests/corelib/{rel:Py4GWCoreLib/tests}"
tier = "dev"

# Wave 3 — blocked on making the BuildMgr.py:2037 registry multi-root.
