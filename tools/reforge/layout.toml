tier = "script"
note = "Shared library, not a widget: EZ Cast.py subclasses its SkillData. The Widgets/Coding/** sweep put it in py4gw-devtools, whose hyphen makes it unimportable, so EZ Cast dies at load. Widgets/lib/ is importable as Widgets.lib and gets no .widget marker precisely because this entry is tier=script — write_markers() only touches dirs whose tier is widget, so nothing here is loaded as a widget."

[[override]]
match = "Widgets/Coding/Tools/ScriptManagementSystem.py"
dest = "Widgets/Panels/ScriptManagementSystem.py"
tier = "widget"
note = "Manages scripts, is not one. The Widgets/Coding/** sweep demoted it into the devtools pack, where widget discovery never sees it and its own script registry cannot find it either."

