# ============================================================================
# SOURCES — demoted to reference. Contributed trees, not shipped code.
# One [[override]] beats every [[rule]]; the marks_sources override wins over
# it on literal-prefix length, so own-code stays in its pack.
# ============================================================================

[[override]]
match = "Sources/**"
dest = "dev/reference/{rel:Sources}"
tier = "reference"
note = "read-only reference. 27 files outside Sources import from it - see docs/sources_demotion.md"

[[override]]
match = "Sources/marks_sources/**"
dest = "keep"
tier = "lib"
note = "own code, and TeamInventoryViewer.py:35 hardcodes the string path 'Sources/marks_sources/mods_data'. Relocating needs a string codemod on top of the import rewrite; pinned until that is worth doing."

[[override]]
match = "Sources/ApoSource/InvPlus/**"
dest = "keep"
tier = "lib"
note = "carve-out: InventoryPlus.py's 6 lazy imports resolve here. Self-contained (10 files, imports nothing outside itself) and its only get_projects_path use points at Widgets/Config, not its own location."


# ============================================================================
# TABLED — widgets whose eager Sources imports no longer resolve. Parked out of
# the shipped tree rather than left to fail at load. Un-tabling is a one-line
# dest change once each is rewritten against Core.
# ============================================================================

[[override]]
match = "Widgets/Guild Wars/Items & Loot/MerchantRules.py"
dest = "dev/tabled/MerchantRules.py"
tier = "dev"
note = "4 eager imports of Sources.frenkeyLib. 30378 lines; needs a rewrite, not a patch."

[[override]]
match = "Widgets/Guild Wars/Customization/MultiBoxing.py"
dest = "dev/tabled/MultiBoxing.py"
tier = "dev"
note = "6 eager imports of Sources.frenkeyLib"

[[override]]
match = "Widgets/Guild Wars/Screen Overlays/PartyQuestLog.py"
dest = "dev/tabled/PartyQuestLog.py"
tier = "dev"
note = "4 eager imports of Sources.ApoSource + Sources.frenkeyLib"

[[override]]
match = "Widgets/Automation/Helpers/TitleHelper.py"
dest = "dev/tabled/TitleHelper.py"
tier = "dev"
note = "2 eager imports of Sources.aC_Scripts"


# ============================================================================
# PROJECT IDENTITY — ours, not upstream's. Must survive every regeneration.
# ============================================================================

[[override]]
match = "{AGENTS.md,README.md,CLAUDE.md,CHEATSHEET.md}"
dest = "keep"
tier = "docs"
note = "this project's identity. Upstream's originals are preserved verbatim under docs/reference/."

[[rule]]
match = ".vscode/**"
dest = "keep"
tier = "docs"
note = "interpreter + format-on-save contract, not local IDE state"

[[rule]]
match = ".claude/**"
dest = "keep"
tier = "docs"

[[rule]]
match = "docs/reference/**"
dest = "keep"
tier = "docs"
note = "upstream's README/AGENTS, kept verbatim for lookup"

