note = "Not in the preferred-widget set, so it is deliberately not a widget. VoltaicSpearTeamFarm.py:6,392 still imports the class and calls enable_widget('CombatPrep'); that script is slated for refactor and is expected to stop depending on it. Do not restore this as a widget to fix that script."

